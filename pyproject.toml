[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "table-games-bot"
version = "0.1.0"
description = "Extensible Telegram bot for tabletop games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.19,<4",
  "aiosqlite>=0.20,<1",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
packages = ["app", "app.bot", "app.bot.routers", "app.domain", "app.domain.games", "app.services", "app.storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep annotations and UTC compatible with the local Python 3.9 verification environment.
ignore = ["UP017", "UP045"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations"]
